services:
  exqserve:
    image: ghcr.io/exq-ai/exqserve:${EXQSERVE_IMAGE_TAG:-latest}
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${EXQSERVE_PORT:-8000}:8000"
    environment:
      - EXQSERVE_API_KEY
      - EXQSERVE_API_KEY_FILE
    volumes:
      - type: bind
        source: "${EXQSERVE_MODEL_DIR:?Set EXQSERVE_MODEL_DIR to the host model directory}"
        target: /models
        read_only: true
    shm_size: "${EXQSERVE_SHM_SIZE:-8gb}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "/models/${EXQSERVE_MODEL_NAME:?Set EXQSERVE_MODEL_NAME to the model directory name}"
      - --model-root
      - /models
      - --host
      - 0.0.0.0
      - --port
      - "8000"
